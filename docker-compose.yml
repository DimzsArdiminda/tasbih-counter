version: "3.9"

services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: do-dzikir

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

    environment:
      NODE_ENV: development

    command: pnpm run dev